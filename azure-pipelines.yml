trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: npm install
  workingDirectory: backend
  displayName: 'Install Dependencies'

- script: node --check server.js
  workingDirectory: backend
  displayName: 'Check Backend Code'